  <rect x="595" y="1017" width="150" height="30" rx="6" class="outline"/>
  <text x="606" y="1037" font-size="10">Practice questions</text>
  <rect x="786" y="875" width="322" height="153" rx="8" class="soft"/>
  <text x="802" y="900" font-size="11" font-weight="bold">Original PDF preview</text>
  <text x="802" y="927" font-size="10" class="muted">Download other original files here.</text>
  <text x="786" y="1053" font-size="11" font-weight="bold">Full text · scroll to read</text>
  <line x1="449" y1="1082" x2="1108" y2="1082" class="line"/>
