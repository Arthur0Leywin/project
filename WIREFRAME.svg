    <text x="963" y="478" font-size="16" class="muted">···</text>
    <text x="693" y="521" font-size="11" class="muted">History</text>
    <text x="693" y="544" class="label">Document title</text>
    <text x="693" y="566" font-size="11" class="muted">Short summary or document preview...</text>
    <line x1="693" y1="583" x2="979" y2="583" class="line"/>
    <text x="693" y="599" font-size="10" class="muted">File size · date</text>
    <text x="955" y="599" font-size="14" fill="#efa94f">★</text>

    <rect x="1014" y="446" width="338" height="164" rx="10" class="outline"/>
    <rect x="1031" y="463" width="35" height="35" rx="8" class="soft"/>
    <text x="1036" y="485" font-size="9">NOTES</text>
    <text x="1318" y="478" font-size="16" class="muted">···</text>
    <text x="1031" y="521" font-size="11" class="muted">Psychology</text>
    <text x="1031" y="544" class="label">Document title</text>
    <text x="1031" y="566" font-size="11" class="muted">Short summary or document preview...</text>
    <line x1="1031" y1="583" x2="1335" y2="583" class="line"/>
    <text x="1031" y="599" font-size="10" class="muted">File size · date</text>
    <text x="1310" y="599" font-size="14" fill="#efa94f">☆</text>
  </g>

  <line x1="338" y1="655" x2="1352" y2="655" class="line"/>
  <text x="338" y="681" font-size="11" class="muted">On phones, the menu becomes icons and cards stack in one column.</text>

  <text x="54" y="742" font-size="20" font-weight="bold">Document details · pop-up after you select a file</text>
  <rect x="54" y="766" width="1332" height="388" rx="14" fill="#eeedf4" stroke="#d9d7e2" stroke-width="2"/>
  <rect x="424" y="791" width="710" height="338" rx="15" class="outline"/>
  <rect x="1092" y="804" width="24" height="24" rx="6" class="soft"/>
  <text x="1099" y="822" class="small muted">×</text>
  <rect x="449" y="811" width="35" height="35" rx="8" class="soft"/>
  <text x="457" y="833" font-size="10">PDF</text>
  <text x="497" y="825" class="label">Document title</text>
  <text x="497" y="843" font-size="11" class="muted">Category · file size · date</text>
  <line x1="449" y1="859" x2="1108" y2="859" class="line"/>
  <text x="449" y="881" font-size="11" font-weight="bold">Category</text>
