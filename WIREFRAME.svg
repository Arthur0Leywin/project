  <text x="101" y="545" class="small">Psychology</text>
  <circle cx="87" cy="572" r="5" fill="#e79aaf"/>
  <text x="101" y="577" class="small">Literature</text>
  <text x="258" y="449" font-size="20" class="muted">+</text>
  <text x="80" y="601" font-size="11" class="muted">+ add a category</text>

