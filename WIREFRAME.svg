  <text x="1326" y="133" class="small">J</text>
  <line x1="296" y1="154" x2="1386" y2="154" class="line"/>

  <text x="338" y="201" font-size="12" font-weight="bold" class="muted">YOUR SECOND BRAIN FOR STUDYING</text>
  <text x="338" y="241" font-size="28" font-weight="bold">Everything in its right place.</text>
  <text x="338" y="268" class="small muted">Notes, readings, and assignments — organized and ready when you need them.</text>
