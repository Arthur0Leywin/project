  <text x="54" y="1201" font-size="20" font-weight="bold">Key user flows</text>
  <rect x="54" y="1227" width="390" height="82" rx="12" class="flow"/>
  <text x="76" y="1258" class="label">Upload and organize</text>
  <text x="76" y="1284" class="small muted">Add a file → sort it into a category → save</text>
  <rect x="525" y="1227" width="390" height="82" rx="12" class="flow"/>
  <text x="547" y="1258" class="label">Read and study</text>
  <text x="547" y="1284" class="small muted">Open a file → read notes → make questions</text>
  <rect x="996" y="1227" width="390" height="82" rx="12" class="flow"/>
  <text x="1018" y="1258" class="label">Find and re-categorize</text>
  <text x="1018" y="1284" class="small muted">Find a file → open it → change its category</text>
  <path d="M445 1268 H511" class="arrow"/>
  <path d="M916 1268 H982" class="arrow"/>
  <text x="54" y="1362" font-size="12" class="muted">The app suggests categories from file names, readable text, and your keywords.</text>
</svg>
