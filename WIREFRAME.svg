  <text x="449" y="947" font-size="11" font-weight="bold">Quick summary · key terms · key points</text>
  <text x="449" y="967" font-size="10" class="muted">Read the generated study notes and extracted terms.</text>
  <rect x="449" y="983" width="318" height="82" rx="8" class="soft"/>
