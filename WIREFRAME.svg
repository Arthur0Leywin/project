<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1435" viewBox="0 0 1440 1435" role="img" aria-labelledby="title description">
  <title id="title">Recall dashboard and document detail wireframe</title>
  <desc id="description">Desktop study document dashboard, a separate centered document-detail modal state, and key upload, search, category, and study flows.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #24233a; }
      .muted { fill: #89899b; }
      .small { font-size: 13px; }
      .label { font-size: 15px; font-weight: bold; }
      .outline { fill: #fff; stroke: #d9d7e2; stroke-width: 2; }
      .soft { fill: #f7f6fb; stroke: #e6e3ee; stroke-width: 1.5; }
      .purple { fill: #f0ebff; stroke: #7658e8; stroke-width: 2; }
      .flow { fill: #fff; stroke: #c9c4d8; stroke-width: 2; }
      .line { stroke: #dedbe7; stroke-width: 2; }
      .arrow { stroke: #7658e8; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7658e8"/>
    </marker>
  </defs>

  <rect width="1440" height="1120" fill="#f8f8fb"/>
  <text x="54" y="48" font-size="24" font-weight="bold">Recall — screen layout</text>
  <text x="54" y="73" class="small muted">Main dashboard · Computer screen · Shows where things go and how they work</text>

  <rect x="54" y="102" width="1332" height="740" rx="14" class="outline"/>
  <rect x="54" y="102" width="242" height="740" rx="14" fill="#fff" stroke="#d9d7e2" stroke-width="2"/>
  <line x1="296" y1="102" x2="296" y2="842" class="line"/>

  <rect x="78" y="128" width="34" height="34" rx="10" class="purple"/>
  <text x="124" y="153" font-size="23" font-weight="bold">recall.</text>
  <rect x="76" y="184" width="197" height="58" rx="10" class="soft"/>
  <text x="91" y="208" class="label">Study space</text>
  <text x="91" y="229" class="small muted">Personal workspace</text>

