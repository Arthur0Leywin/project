  <text x="397" y="325" class="small muted">Ask anything or search your documents...</text>
  <rect x="1118" y="307" width="59" height="28" rx="5" class="soft"/>
  <text x="1129" y="326" font-size="11" class="muted">⌘ K</text>
  <rect x="1202" y="307" width="126" height="34" rx="7" class="purple"/>
  <text x="1227" y="329" class="small">Search</text>
  <text x="398" y="359" font-size="11" class="muted">Try a question about your notes · Search shows matching parts</text>

  <text x="338" y="424" font-size="17" font-weight="bold">Your documents</text>
  <rect x="462" y="405" width="31" height="25" rx="6" class="soft"/>
  <text x="473" y="422" font-size="12" class="muted">#</text>
  <rect x="1135" y="399" width="128" height="32" rx="7" class="outline"/>
